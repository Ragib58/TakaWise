packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default. Allow only what is needed.
onlyBuiltDependencies:
  - '@swc/core'
  - '@parcel/watcher'
  - '@prisma/engines'
  - prisma
  - esbuild

# Telemetry/analytics postinstall scripts are explicitly denied.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  # Optional native accelerator for bullmq; prebuilt binaries are used when available.
  - msgpackr-extract
