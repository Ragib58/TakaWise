packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default. Allow only what is needed.
onlyBuiltDependencies:
  - '@swc/core'
  - '@parcel/watcher'
  - '@prisma/engines'
  - prisma
  - esbuild

# Telemetry/analytics postinstall scripts are explicitly denied.
# Security overrides (docs/security/dependency-audit.md).
overrides:
  # GHSA (DoS via pending fileFilter); @nestjs/platform-express pins 2.4.0.
  multer: 2.5.0

ignoredBuiltDependencies:
  - '@scarf/scarf'
  # Optional native accelerator for bullmq; prebuilt binaries are used when available.
  - msgpackr-extract
