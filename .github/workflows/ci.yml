name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Accepted lower-severity findings are documented in docs/security/dependency-audit.md.
      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level high

      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

  images:
    name: Container images & scan
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t takawise-api:ci .

      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.staging.example/api/v1 -t takawise-web:ci .

      - name: Scan images (fail on fixable HIGH/CRITICAL)
        run: |
          for image in takawise-api:ci takawise-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
              image --timeout 20m --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 --no-progress "$image"
          done

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Fresh, throwaway database per run: migrations are verified from empty.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: takawise
          POSTGRES_PASSWORD: takawise_ci_password
          POSTGRES_DB: takawise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U takawise -d takawise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://takawise:takawise_ci_password@localhost:5432/takawise_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      PRISMA_HIDE_UPDATE_MESSAGE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (also runs prisma generate)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations are in sync with schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Test (unit, e2e, DB integration)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: takawise
          POSTGRES_PASSWORD: takawise_ci_password
          POSTGRES_DB: takawise_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U takawise -d takawise_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1035:1025
          - 8035:8025

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://takawise:takawise_ci_password@localhost:5432/takawise_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1035
      CORS_ORIGINS: http://localhost:3100
      APP_BASE_URL: http://localhost:3100
      LOG_LEVEL: warn
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      # Phase 9: the deterministic offline AI provider (never a real key in CI).
      AI_ENABLED: 'true'
      AI_PROVIDER: fake
      # Every simulated user shares one IP; per-IP rate limits are covered by API tests.
      THROTTLE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate throwaway auth secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "AUTH_HMAC_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Migrate and seed
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (servers started by Playwright)
        working-directory: apps/web
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
